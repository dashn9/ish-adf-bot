apiVersion: apps/v1
kind: Deployment
metadata:
  name: webbot
  namespace: bots
  labels:
    app: webbot
    type: ishbot
spec:
  template:
    metadata:
      name: webbot-pod
      labels:
        app: webbot
        type: ishbot
    spec:
      containers:
        - name: webbot
          image: us-east4-docker.pkg.dev/centering-rider-426308-i2/ish-bot/ish_bot:e45ba555cdb9b1fb6c11e6cb8fa817a4c881ee34
          envFrom:
            - secretRef:
                name: ish-bot-proxy-auths
          ports:
            - containerPort: 5900
              name: vnc
          resources:
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
          - name: storage
            mountPath: /ebs
          - name: config-volume
            mountPath: /app/configs

      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: ish-bot-ebs-pvc
      - name: config-volume
        configMap:
          name: ish-bot-config

  replicas: 1
  selector:
    matchLabels:
      type: ishbot
