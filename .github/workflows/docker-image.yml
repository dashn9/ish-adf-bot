name: Build and Push to GCR
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Extensions Dir
        run: mkdir -p executables/extensions/chrome

      - name: Download Bot Extensions for Chrome
        env:
          GITHUB_TOKEN: ${{ secrets.ISH_BOT_EXTENSIONS_GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: token $secrets.ISH_BOT_EXTENSIONS_GITHUB_TOKEN" https://api.github.com/repos/Ishogbon/ish-bot-fp-spoofer/releases/assets/194017183 -o executables/extensions/chrome/browser_spoofer.crx
          curl -L -H "Authorization: token $secrets.ISH_BOT_EXTENSIONS_GITHUB_TOKEN" https://api.github.com/repos/Ishogbon/ish-bot-chrome-network-extension/releases/assets/194017614 -o executables/extensions/chrome/browser_network.crx

      - name: Authenticate Google Cloud SDK
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCR_SERVICE_ACCOUNT_CREDENTIALS }}'
          
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker to use Google Cloud
        run: gcloud auth configure-docker us-east4-docker.pkg.dev

      - name: Build and tag the Docker image
        run: |
          docker build -t us-east4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ish-bot/ish_bot:${{ github.sha }} .

      - name: Push the Docker image
        run: |
          docker push us-east4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ish-bot/ish_bot:${{ github.sha }}